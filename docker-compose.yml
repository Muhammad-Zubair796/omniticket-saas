services:
  postgres:
    image: postgres:16-alpine
    container_name: omni_db
    restart: always
    environment:
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: saas_super_secret_password
      POSTGRES_DB: omniticket_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - saas_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omni_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: omni_web
    restart: always
    ports:
      - "80:8000"
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: saas_super_secret_password
      POSTGRES_DB: omniticket_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

volumes:
  saas_postgres_data:
