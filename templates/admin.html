<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OmniTicket SaaS | Organizer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-extrabold text-indigo-400">OmniTicket SaaS</h1>
                <p class="text-gray-400 text-sm">Organizer & Admin Management Console</p>
            </div>
            <span class="bg-indigo-600/30 text-indigo-300 text-xs px-3 py-1 rounded-full border border-indigo-500/30">Multi-Tenant v1.0</span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            {% for event in events %}
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs uppercase tracking-wider px-2 py-1 bg-gray-700 rounded font-bold text-gray-300">{{ event.category }}</span>
                        <span class="text-xs text-green-400 font-semibold">● LIVE</span>
                    </div>
                    <h2 class="text-xl font-bold mb-1">{{ event.title }}</h2>
                    <p class="text-gray-400 text-sm mb-4">Venue: {{ event.venue_name }}</p>
                    
                    <div class="bg-gray-900/60 rounded-lg p-4 mb-4 border border-gray-700/50">
                        <p class="text-xs text-gray-400">Configured Inventory</p>
                        <p class="text-2xl font-black text-white">{{ event.seat_count }} <span class="text-sm font-normal text-gray-400">Total Seats</span></p>
                    </div>
                </div>

                <div class="space-y-3">
                    <form action="/admin/generate-seats/{{ event.id }}" method="POST">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-lg text-sm transition">
                            {% if event.seat_count == 0 %}⚡ Generate Seating Layout (50 Seats){% else %}🔄 Regenerate Seating Layout{% endif %}
                        </button>
                    </form>
                    <a href="/event/{{ event.id }}" target="_blank" class="block text-center w-full bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg text-sm transition">
                        Open Public Seat Map ↗
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
